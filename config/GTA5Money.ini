[Money]
; Amount used by the hotkeys (0 .. 2000000000)
Amount=10000000

[Rank]
; Level used by Ctrl+Shift+4 (1 .. 1000)
Level=120
; XP written with the rank. The game's scripts derive the rank they use for
; shop/unlock checks from this stat, so it has to match the level above.
; 1584350 is the retail rank-120 RP threshold.
XP=1584350
; Re-apply the level automatically whenever a multiplayer session starts and
; after the game resets CHAR_RANK_FM (maintransition sets it to 1 on entry).
AutoApply=1

[Unlock]
; Marks the freemode intro, trigger tutorial and the Simeon garage cutscene as
; done. Dynasty 8 refuses property sales with the "will be unlocked after you
; get a call from Simeon" / "sufficient rank" error until the freemode unlock
; bit for custom car garages is set, and freemode only builds that bit when
; MP<slot>_FM_INTRO_MISS_DONE, FM_TRIGTUT_DONE and FM_CUT_DONE bit 0
; (Simeon garage cutscene) are set. Applied automatically; the unlock bits are
; rebuilt at the next transition into freemode, so rejoin once if you were
; already in a session when the DLL wrote the flags.
IntroDone=1
